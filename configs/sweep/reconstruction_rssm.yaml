# @package _global_
# Optimizer and method parameters follow Sobal et al.'s code (Adam, constant lr, no weight decay, min_var and batch of reproduce_configs/*.rssm.best.yaml); the lr range spans LeWM's 5e-5 and their tuned 7.3e-5 to 3.7e-3, the effective batch is 64 times the accumulation.
defaults:
  - base
  - _self_

hydra:
  sweeper:
    params:
      optimizer.lr: tag(log, interval(1e-5, 5e-3))
      accumulation: choice(1, 2, 4, 8)
      model.min_var: choice(0.0, 0.02, 0.05, 0.1)
