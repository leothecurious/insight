forward:
  _target_: insight.losses.reconstruction.reconstruction
  _partial_: true
  history_size: ${wm.history_size}
sigreg:
  knots: 17
  num_proj: 1024
modules:
  decoder:
    _target_: stable_pretraining.backbone.CNNImageDecoder
    embed_dim: ${embed_dim}
    img_size: ${img_size}
    start_size: 7 # img_size / start_size must be a power of two: 28 and 224 px frames
