defaults:
  - _self_
  - data: pusht
  - model: lewm
  - loss: lewm
  - launcher: local
  - optional local: local

# One run name for the weights, config.yaml, resume state and metrics.
run: ???
resume: false
# The run name without its seed: W&B groups a series' seeds by it (docs/naming.md).
series: ${eval:'"${run}".rsplit("_s", 1)[0]'}

# null: STABLEWM_HOME, else ~/.stable_worldmodel. Set in local/local.yaml.
paths:
  data: null # holds datasets/
  runs: null # holds checkpoints/

seed: 3072
num_workers: 6
img_size: 224
patch_size: 14
encoder_scale: tiny
embed_dim: 192

wm:
  history_size: 3
  num_preds: 1

data:
  dataset:
    cache_dir: ${paths.data}

trainer:
  max_epochs: 100
  devices: 1
  accelerator: gpu
  precision: bf16
  gradient_clip_val: 1.0

loader:
  batch_size: 128
  num_workers: ${num_workers}
  drop_last: true
  persistent_workers: true
  prefetch_factor: 3
  pin_memory: true
  shuffle: true

optimizer:
  type: AdamW
  lr: 5e-5
  weight_decay: 1e-3
# warmup_cosine: a 1% linear warmup, then cosine decay to zero over all steps. constant: the lr throughout.
schedule: warmup_cosine
# Micro-batches whose mean gradient one optimizer step applies, for batches too big for the GPU.
accumulation: 1

# Weights are saved at these epochs and the last one (null: every epoch), and after these optimizer steps.
checkpoint:
  epochs: [5, 10]
  steps: null

# spt's RankMe of the embeddings at each validation, a training-time collapse monitor.
monitor:
  enabled: true
  queue_length: 4096

# Pair cosines of the backbone on n dataset frames drawn before training, logged as val/pair/* (see
# insight.metrics.pairs); the tag has the run's tag size when it has one. null skips.
pairs:
  n: 256
  every_n_steps: 100
  tag_size: 5

# The keys under config are WandbLogger arguments. W&B is opened before work starts.
wandb:
  enabled: false
  config:
    entity: leothecurious-none
    project: insight
    name: ${run}
    id: ${run}
    job_type: train
    resume: allow
    save_code: true
