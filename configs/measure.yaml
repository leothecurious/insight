defaults:
  - _self_
  - launcher: local
  - optional local: local

# The run's folder holds <series>_epoch_N.pt, config.json and config.yaml. weights: random measures an
# untrained model built from the run's config. Targets come from the run's data.measure.
run: ???
weights: ???
latents_path: null # reuse saved latents instead of encoding
# Replaces data.measure.files: the file that fits the probes, then the file that scores them. Selecting
# hyperparameters scores a validation file, never the test file.
files: null
wandb: true # write the results to the run's W&B summary when the run used W&B

paths:
  data: null # holds datasets/
  runs: null # holds checkpoints/

seed: 0
device: cuda
embedding: projector # projector | backbone_cls

# Windows are drawn from the run's training episodes (probe train side) and validation episodes
# (probe test side, predictor-vs-copy).
windows:
  frames: 33 # observations per window
  min_frames: 4 # episodes with fewer frames are skipped
  n_train: 800
  n_val: 200
  start: episode_start # episode_start | any_start
  precision: fp32 # fp32 | bf16 | fp16
  rollout: false # also predict each window from its first frame and its actions (the rollout_probe metric)
  batch_size: 16
  num_workers: 0

metrics:
  - {name: state_probe, groups: [state], kinds: [linear, mlp], windows: [1]}

# Predictor error against copying the last context embedding, on the validation windows.
pred_copy:
  batch_size: 512

# Pair cosines (insight.metrics.pairs): colour uses same-tag/same-content pairs against unrelated
# background frames; t_position uses Push-T scenes whose goal outline is the tag and block pose is content.
pairs:
  suite: colour # colour | t_position
  n: 256
tag_size: 5 # corner tag of the pair metric and the colour probe; a run trained with a tag uses its own size

# Decode the stamped colour from the latents.
colour:
  n: 4096
  kinds: [ridge, mlp]
  train_fraction: 0.8
