# @package _global_
# Architecture and optimizer parameters are centred on LeWM's config (configs/train.yaml: AdamW, lr 5e-5, weight_decay 1e-3, warmup_cosine), the effective batch is 64 times the accumulation; the reconstruction loss has no method parameter.
defaults:
  - base
  - _self_

hydra:
  sweeper:
    params:
      optimizer.lr: tag(log, interval(1e-5, 5e-4))
      optimizer.weight_decay: tag(log, interval(1e-4, 1e-1))
      accumulation: choice(1, 2, 4)
loader: {batch_size: 64}
